<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ALTER GENESIS — app icon concepts</title>
  <style>
    :root { color-scheme: light; font-family: "Yu Gothic UI", "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #f2f2f0; color: #202124; }
    main { width: 1200px; min-height: 760px; padding: 56px 64px 64px; }
    h1 { margin: 0; font: 600 30px/1.2 "Segoe UI", sans-serif; letter-spacing: .08em; }
    .lead { margin: 12px 0 40px; color: #666; font-size: 15px; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
    article { min-height: 520px; padding: 28px; border-radius: 24px; background: #fff; box-shadow: 0 1px 0 rgba(0,0,0,.05); }
    .hero { height: 292px; display: grid; place-items: center; border-radius: 18px; background: #fafafa; }
    .hero img { width: 220px; height: 220px; }
    h2 { margin: 24px 0 8px; font-size: 22px; }
    p { margin: 0; color: #555; font-size: 15px; line-height: 1.7; }
    .sizes { display: flex; align-items: end; gap: 14px; margin-top: 24px; color: #888; font-size: 12px; }
    .sizes img { display: block; }
    .dark { margin-left: auto; padding: 14px; border-radius: 12px; background: #2e2e30; }
    .dark img { filter: invert(1); }
  </style>
</head>
<body>
  <main>
    <h1>ALTER GENESIS</h1>
    <p class="lead">App icon concepts · monochrome first pass · 2026-10-30</p>
    <section class="grid">
      <article>
        <div class="hero"><img src="a-kokuin-band.svg" alt="A 刻印帯"></div>
        <h2>A — 刻印帯</h2>
        <p>通知カードの太い左帯と、予定へ食い込む楔形の切欠きを一つの印にした案。</p>
        <div class="sizes"><img src="a-kokuin-band.svg" width="16" height="16"><img src="a-kokuin-band.svg" width="24" height="24"><img src="a-kokuin-band.svg" width="32" height="32"><span>16 / 24 / 32</span><span class="dark"><img src="a-kokuin-band.svg" width="32" height="32"></span></div>
      </article>
      <article>
        <div class="hero"><img src="b-alter-gate.svg" alt="B 改変門"></div>
        <h2>B — 改変門</h2>
        <p>左の帯を柱として、斜めの梁と切れた横棒でALTERのAを門の形にした案。</p>
        <div class="sizes"><img src="b-alter-gate.svg" width="16" height="16"><img src="b-alter-gate.svg" width="24" height="24"><img src="b-alter-gate.svg" width="32" height="32"><span>16 / 24 / 32</span><span class="dark"><img src="b-alter-gate.svg" width="32" height="32"></span></div>
      </article>
      <article>
        <div class="hero"><img src="c-time-intervention.svg" alt="C 時の介入"></div>
        <h2>C — 時の介入</h2>
        <p>時間の流れを表す太い環へ、通知カードの帯が割り込んで止める案。</p>
        <div class="sizes"><img src="c-time-intervention.svg" width="16" height="16"><img src="c-time-intervention.svg" width="24" height="24"><img src="c-time-intervention.svg" width="32" height="32"><span>16 / 24 / 32</span><span class="dark"><img src="c-time-intervention.svg" width="32" height="32"></span></div>
      </article>
    </section>
  </main>
</body>
</html>
